name: Radiomonitoring Task

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests openai

      - name: Run radiomonitoring solver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python radiomonitoring.py
